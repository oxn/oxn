name: Waka Readme Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: 更新WakaTime统计到README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ github.TOKEN }}
          WAKATIME_API_URL: https://wakatime.com/api
          # 开启调试日志，打印完整API请求返回，排查403根源
          DEBUG_LOGGING: true
          SHOW_LANGUAGE: true
          SHOW_EDITORS: true
          SHOW_OS: true
          SHOW_PROJECTS: false
          COMMIT_BY_ME: true
          # 强制强制覆盖README，避免缓存问题
          FORCE_ADD: true
