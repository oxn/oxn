name: Snake Contrib

on:
  schedule:
    # UTC 0点 = 北京时间早上8点
    - cron: "0 0 * * *"
  # 允许手动运行
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 拉取仓库代码，推送依赖此步骤
      - name: Checkout repository
        uses: actions/checkout@v4

      # 生成明暗两套贪吃蛇SVG
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 关键修复：参数名改为 github_token，不再使用 token
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/profile-snake-contrib/github-contribution-grid-snake.svg
            dist/profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 推送生成文件到独立 output 分支，不污染主分支
      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          # 推送仅需要内置临时token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
